name: Build and Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 如需 arm64（如部分 ARM NAS），把 platforms 改为
      # linux/amd64,linux/arm64 —— QEMU 模拟构建耗时约 3~5 倍
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=3.3.5-fork.r${{ github.run_number }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-bangumi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-bangumi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
